# La maquette est concue pour une surface claire : la couleur de serie du
# graphique est validee contre du blanc. On epingle donc le theme clair, au lieu
# de le rattraper a coups de !important dans le CSS.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fb"
textColor = "#0b0b0b"
font = "sans serif"
